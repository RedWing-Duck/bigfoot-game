<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Text RPG Framework</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e8e3;--fg:#22262b;--dim:#6b7178;--accent:#8a5a00;--npc:#2f5d8a;--item:#3d6b3a;--err:#a4262c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1e24;--fg:#d8dcd2;--dim:#7d8590;--accent:#e0a84a;--npc:#7fb2e5;--item:#8cc78a;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#1a1e24;--fg:#d8dcd2;--dim:#7d8590;--accent:#e0a84a;--npc:#7fb2e5;--item:#8cc78a;--err:#ff8a80}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.55 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column}
#out,form{width:100%;max-width:42rem;margin:0 auto;box-sizing:border-box;padding:1rem}
#out{flex:1;overflow-y:auto}
#out p{margin:0 0 .75rem;white-space:pre-wrap}
.cmd{color:var(--dim)}
.title{font-weight:600}
.npc,.item{font-weight:600}
.npc{color:var(--npc)}
.item{color:var(--item);text-decoration:underline;text-underline-offset:.2em}
form{display:flex;gap:.5rem;border-top:1px solid var(--dim)}
input{flex:1;font:inherit;color:inherit;background:transparent;border:0;outline:0}
form:focus-within{border-top-color:var(--accent)}
#menu{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1rem;width:100%;max-width:42rem;margin:0 auto;padding:1rem;box-sizing:border-box}
#menu h1{font-size:2rem;margin:0 0 1rem;color:var(--accent)}
#menu button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--dim);padding:.6rem 1.5rem;min-width:12rem;text-align:left;cursor:pointer}
#menu button:hover,#menu button:focus-visible{border-color:var(--accent);color:var(--accent);outline:0}
[hidden]{display:none!important}
#err{color:var(--err);border-left:3px solid var(--err);padding-left:1rem;margin:0;white-space:pre-wrap;font:inherit;font-size:.875rem;max-height:40vh;overflow:auto}
#ask{display:flex;flex-direction:column;gap:1rem}
#ask p{margin:0;max-width:30rem}
body.playing #menu,body:not(.playing) #out,body:not(.playing) form{display:none}
</style>
</head>
<body>
<div id="menu"><h1 id="mt"></h1><pre id="err" hidden></pre><button id="bs">Start</button><button id="bc" hidden>Continue</button>
  <div id="ask" hidden><p>This will start a new game. Previous saved data will be lost.</p><button id="by">Yes</button><button id="bn">No</button></div></div>
<div id="out" aria-live="polite"></div>
<form id="f"><span class="title">&gt;</span><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="Command" autofocus></form>

<script>
// Game data reference: docs/AUTHORING.md
// THIS PLACE HAS A BIG FOOTPRINT (Week 01). GDD ids in comments: R1-R12 rooms, I1-I5 items, N1-N3 NPCs, P1-P3 puzzles.

// ---- All player-facing text, keyed by Script id. Logic lives in G below.
const T = {
  intro: "<intro placeholder> Get the Don's secrets and get out. Type HELP for commands.",
  room: {   // FIRST (first tour visit), REVISIT (later tour visits), ESCAPE (once the chaos starts)
    R1: { first: "<R1 FIRST> A gold elevator. The foyer is north.", revisit: "<R1 REVISIT>", escape: "<R1 ESCAPE> One button, one way down." },
    R2: { first: "<R2 FIRST> Two staircases, left for family, right for business.", revisit: "<R2 REVISIT>", escape: "<R2 ESCAPE> The thirteenth step catches the light." },
    R3: { first: "<R3 FIRST> Glass cases and a [rifle].", revisit: "<R3 REVISIT>", escape: "<R3 ESCAPE>" },
    R4: { first: "<R4 FIRST> A mirrored [piano].", revisit: "<R4 REVISIT>", escape: "<R4 ESCAPE> Mama's piano. Mama's song." },
    R5: { first: "<R5 FIRST> A long table, two grandmothers' portraits.", revisit: "<R5 REVISIT>", escape: "<R5 ESCAPE>" },
    R6: { first: "<R6 FIRST> A balcony. Portraits west, office east.", revisit: "<R6 REVISIT>", escape: "<R6 ESCAPE>" },
    R7: { first: "<R7 FIRST> A hall of portraits of the Don.", revisit: "<R7 REVISIT>", escape: "<R7 ESCAPE>" },
    R8: { first: "<R8 FIRST> A bronze [hippo] fountain, mouth shut.", revisit: "<R8 REVISIT>", escape: "<R8 ESCAPE> The [hippo] waits, mouth shut." },
    R9: { first: "<R9 FIRST> Leather, cigars, LEGITIMATE BUSINESS.", revisit: "<R9 REVISIT>", escape: "<R9 ESCAPE>" },
    R10: { first: "<R10 FIRST> Peacocks, and the [aviary] door's red keypad.", revisit: "<R10 REVISIT>", escape: "<R10 ESCAPE> The [aviary] keypad is smashed." },
    R11: { first: "<R11 FIRST> Alarms! The Don runs. You're alone. The chaos begins.", revisit: "<R11 REVISIT> The [giraffegate] and the [jaguargate]." },
    R12: { escape: "<R12 ESCAPE> Bent bars. BIG TONY - DO NOT FEED." }
  },
  item: {
    card: { look: "<I1 LOOK> Walter Pryce. The Dog-Eared Page. A brass plaque.", take: "<I1 TAKE>", use: "<I1 USE wrong>" },
    coin: { look: "<I2 LOOK> Your first dividend.", take: "<I2 TAKE>", use: "<I2 USE wrong>" },
    ledger: { look: "<I3 LOOK>", take: "<I3 TAKE>" },
    manifest: { look: "<I4 LOOK>", take: "<I4 TAKE>" },
    photos: { look: "<I5 LOOK>", take: "<I5 TAKE>" },
    evidence: "<I3-I5 USE> It's evidence; keep it safe.",
    rifle: "<scenery: gold rifle>", piano: "<scenery: piano>", staircase: "<scenery: staircases>", hippo: "<scenery: hippo>",
    aviary: "<scenery: aviary door>", giraffegate: "<scenery: giraffe gate>", jaguargate: "<scenery: jaguar gate>"
  },
  don: {
    look: "<N1 examine>",
    stop: {   // said on arriving at each tour stop; the last line names the next direction
      R2: "<N1 GREETING + R2> Never trust the thirteenth step. In this house we never choose between family. West.",
      R3: "<N1 R3> Admire, don't touch. Back east, then the salon.",
      R4: "<N1 R4> Only one song is played on her: my mother's. Back west, then north.",
      R5: "<N1 R5> Mama Rosa sang 'Cielito Lindo' every Sunday.",
      R9: "<N1 R9> A reading room with my name on it.",
      R7: "<N1 R7> Anything gets loose, my boys chase it. North.",
      R8: "<N1 R8> He flicks a coin into the [hippo]: she only opens up for gold. North.",
      R10: "<N1 R10> My peacocks. North."
    },
    after1: "<N1 after Q1> Now upstairs. South, then up, then east.",
    after2: "<N1 after Q2> Your first dividend. West, west, then north.",
    talk: "<N1 TALK DURING TOUR> Questions later, Walter. Keep up."
  },
  nando: { look: "<N2 examine>", greet: "<N2 GREETING> Nando blocks the way. Why are you up here?", after: "<N2 AFTER TASK> Nando is gone." },
  q1: { prompt: "<Q1 PROMPT> Pozole or Sunday gravy?", right: "<Q1 CORRECT> Both!", wrong: "<Q1 WRONG> He asks again." },
  q2: { prompt: "<Q2 PROMPT> What's your bookstore called?", right: "<Q2 CORRECT> The Dog-Eared Page.", wrong: "<Q2 WRONG> He asks again." },
  strike1: "<STRIKE 1> The Don's smile tightens.", strike2: "<STRIKE 2> The smile is gone.",
  tourBlock: "<TOUR BLOCK> Private, amigo. This way.",
  downTour: "<ELEVATOR during TOUR> Leaving before dessert?",
  downEmpty: "<ELEVATOR < 2 secrets> You're not leaving empty-handed.",
  gateTour: "<GATES DURING TOUR> Locked tight, and the Don is watching.",
  p1: { solved: "<P1 SOLVED> A hidden tray: the LEDGER.", wrong: "<P1 WRONG> Which song does this piano keep?", hint: "<P1 HINT>" },
  p2: { solved: "<P2 SOLVED> The jaw opens: the SHIPPING MANIFEST.", wrong: "<P2 WRONG> She only opens up for one thing.", hint: "<P2 HINT>" },
  p3: { solved: "<P3 SOLVED> A hidden panel: the DEAL PHOTOS.", wrong: "<P3 WRONG> It's just a step.", hint: "<P3 HINT>" },
  alibi: { peacocks: "<open AVIARY> Alibi: PEACOCKS.", giraffe: "<open GIRAFFE GATE> Alibi: GIRAFFE.", jaguar: "<open JAGUAR GATE> Alibi: JAGUAR.",
    already: "<Already open>" },
  guard: { run: "<RUN> You bolt.", peacocks: "<say PEACOCKS> Nando runs.", giraffe: "<say GIRAFFE> Nando runs.", jaguar: "<say JAGUAR> Nando runs." },
  clock: { 6: "<6 TURNS LEFT> A thud.", 3: "<3 TURNS LEFT> A roar.", 1: "<1 TURN LEFT> The floor shakes." },
  hint: { tour: "<HINT TOUR> Listen to the Don.", escape: "<HINT ESCAPE> Walk the tour backward." },
  statusTour: "Tour in progress. Strikes: {strikes}/3.",
  fallback: "<placeholder> That doesn't do anything.",
  end: {
    W1: "<W1 CLEAN GETAWAY> THE END. Secrets recovered: 2/3.",
    W2: "<W2 CLEAN SWEEP> THE END. Secrets recovered: 3/3. Perfect run.",
    L1: "<L1 COVER BLOWN> GAME OVER.",
    L2: "<L2 CAUGHT> GAME OVER.",
    L3: "<L3 BIG FOOTPRINT> GAME OVER."
  }
};

// ---- Tour: the Don's route (GDD 5). During TOUR only the next leg's exit opens.
const ROOM = { elevator: "R1", foyer: "R2", trophy: "R3", salon: "R4", dining: "R5", landing: "R6", gallery: "R7",
  atrium: "R8", office: "R9", aviary: "R10", terrace: "R11", enclosure: "R12" };
const LEGS = [["elevator", "north", "foyer"], ["foyer", "west", "trophy"], ["trophy", "east", "foyer"], ["foyer", "east", "salon"],
  ["salon", "west", "foyer"], ["foyer", "north", "dining"], ["dining", "south", "foyer"], ["foyer", "up", "landing"],
  ["landing", "east", "office"], ["office", "west", "landing"], ["landing", "west", "gallery"], ["gallery", "north", "atrium"],
  ["atrium", "north", "aviary"], ["aviary", "north", "terrace"]];
const ESC = { flag: "escape" }, TOUR = { not: ESC };
const QUIZ = { dining: ["q1", T.q1.prompt], office: ["q2", T.q2.prompt] };   // the Don won't move on until you answer
const exit = (from, dir, to) => {
  const k = LEGS.findIndex(([f, d]) => f === from && d === dir), q = QUIZ[from];
  if (k < 0) return { to, if: ESC, fail: T.tourBlock };
  return { to, if: { any: [ESC, { min: { leg: k }, max: { leg: k }, ...(q && { flag: q[0] }) }] },
    fail: q ? [{ if: { not: { flag: q[0] } }, text: q[1] }, T.tourBlock] : T.tourBlock };
};
const exits = (from, o) => Object.fromEntries(Object.entries(o).map(([d, to]) => [d, exit(from, d, to)]));
const desc = id => { const t = T.room[ROOM[id]];
  return [{ if: ESC, text: t.escape }, { if: { flag: `been_${id}` }, text: t.revisit }, t.first]; };

// ---- Tour strikes (GDD 7): take, touch, open, push, play or use-on a strike object during TOUR
const STRIKE = { add: { strikes: 1 }, say: [{ if: { min: { strikes: 3 } }, text: "" }, { if: { min: { strikes: 2 } }, text: T.strike2 }, T.strike1] };
const strikes = (words, verbs = ["Take", "touch", "open", "push", "play", "use"]) =>
  Object.fromEntries(verbs.map(v => [v, [{ if: { ...TOUR, said: words }, ...STRIKE }]]));
const merge = (...os) => os.reduce((m, o) => { for (const v in o) m[v] = [...(m[v] || []), ...o[v]]; return m; }, {});
const secret = (flag, item, text) => ({ set: flag, add: { secrets: 1 }, give: item, say: text });

// ---- Guard checkpoints (GDD 7): the next turn-costing command must be "run" or "say <released animal>"
const CLEAR = { unset: "checkpoint", add: { cleared: 1 }, move: { nando: null } };
const alibi = a => ({ if: { flag: "checkpoint", said: a, min: { [a]: 1 }, max: { [a]: 1 } }, ...CLEAR, add: { [a]: 1, cleared: 1 }, say: T.guard[a] });
const release = (a, words) => [{ if: { said: words, max: { [a]: 0 } }, add: { [a]: 1 }, say: T.alibi[a] }, { if: { said: words }, say: T.alibi.already }];
const unused = (a, name) => [{ if: { min: { [a]: 1 }, max: { [a]: 1 } }, text: name }];

const STEP = "step|steps|stair|stairs|staircase|staircases|banister";
const HIPPO = "hippo|pepita|fountain|jaw|mouth";

const G = {
  title: "This Place Has a Big Footprint",
  intro: T.intro,
  start: "elevator",
  aliases: { quit: "menu", read: "examine", press: "push", feed: "use", put: "use", insert: "use", flick: "use",
    toss: "use", throw: "use", pet: "touch", release: "open", unlock: "open" },   // verbs add-on
  free: ["look", "examine", "inventory", "status", "hint"],
  fallback: T.fallback,

  rooms: {
    elevator: { name: "Private Elevator", desc: desc("elevator"), exits: exits("elevator", { north: "foyer" }),   // R1
      on: { go: [
        { if: { said: "down", ...TOUR }, say: T.downTour },
        { if: { said: "down", max: { secrets: 1 } }, say: T.downEmpty },
        { if: { said: "down" }, set: "won" } ] } },
    foyer: { name: "Grand Foyer", desc: desc("foyer"),                                                           // R2
      exits: exits("foyer", { south: "elevator", west: "trophy", east: "salon", north: "dining", up: "landing" }),
      on: merge(strikes(`thirteenth|13th|${STEP}`), { push: [
        { if: { ...ESC, said: ["thirteenth|13th|13", "step|stair"], not: { flag: "p3" } }, ...secret("p3", "photos", T.p3.solved) },
        { if: { ...ESC, said: `thirteenth|13th|${STEP}` }, say: T.p3.wrong } ] }) },
    trophy: { name: "Trophy Room", desc: desc("trophy"), exits: exits("trophy", { east: "foyer" }), on: strikes("rifle") },   // R3
    salon: { name: "Music Salon", desc: desc("salon"), exits: exits("salon", { west: "foyer" }),                // R4
      on: merge(strikes("piano|lid|keys", ["Take", "touch", "open", "push", "use"]), { play: [
        { if: TOUR, ...STRIKE },
        { if: { said: "cielito lindo", not: { flag: "p1" } }, ...secret("p1", "ledger", T.p1.solved) },
        { say: T.p1.wrong } ] }) },
    dining: { name: "Dining Hall", desc: desc("dining"), exits: exits("dining", { south: "foyer" }),             // R5
      on: { Say: [
        { if: { not: { flag: "q1" }, said: "both" }, set: "q1", say: T.q1.right + " " + T.don.after1 },
        { if: { not: { flag: "q1" } }, ...STRIKE, say: [{ if: { min: { strikes: 3 } }, text: "" }, T.q1.wrong + " " + T.q1.prompt] } ] } },
    landing: { name: "Upper Landing", desc: desc("landing"), exits: exits("landing", { down: "foyer", west: "gallery", east: "office" }) },   // R6
    gallery: { name: "Gallery Hall", desc: desc("gallery"), exits: exits("gallery", { east: "landing", north: "atrium" }) },                 // R7
    atrium: { name: "Atrium", desc: desc("atrium"), exits: exits("atrium", { south: "gallery", north: "aviary" }),   // R8
      on: merge(strikes(HIPPO), {
        use: [{ if: { ...ESC, said: "coin", has: "coin" }, take: "coin", ...secret("p2", "manifest", T.p2.solved) },
          { if: { ...ESC, said: HIPPO }, say: T.p2.wrong }],
        ...Object.fromEntries(["Take", "touch", "open", "push"].map(v => [v, [{ if: { ...ESC, said: HIPPO }, say: T.p2.wrong }]])) }) },
    office: { name: "The Don's Office", desc: desc("office"), exits: exits("office", { west: "landing" }),       // R9
      on: { Say: [
        { if: { not: { flag: "q2" }, said: "dog eared page|dog eared" }, set: "q2", give: "coin", say: T.q2.right + " " + T.don.after2 },
        { if: { not: { flag: "q2" } }, ...STRIKE, say: [{ if: { min: { strikes: 3 } }, text: "" }, T.q2.wrong + " " + T.q2.prompt] } ] } },
    aviary: { name: "Aviary", desc: desc("aviary"), exits: exits("aviary", { south: "atrium", north: "terrace" }),   // R10
      on: { open: [{ if: { ...TOUR, said: "aviary|door|keypad|cage|peacock|peacocks" }, say: T.gateTour },
        ...release("peacocks", "aviary|door|keypad|cage|peacock|peacocks")] } },
    terrace: { name: "Zoo Terrace", exits: exits("terrace", { south: "aviary", east: "enclosure" }),              // R11
      desc: [{ if: ESC, text: T.room.R11.revisit }, T.room.R11.first],
      on: { open: [...release("giraffe", "giraffe"), ...release("jaguar", "jaguar")] } },
    enclosure: { name: "Broken Enclosure", desc: T.room.R12.escape, exits: exits("enclosure", { west: "terrace" }) }   // R12
  },

  items: {
    card: { name: "briefing card", at: "player", aliases: ["briefing"], desc: T.item.card.look },                  // I1
    coin: { name: "gold coin", desc: T.item.coin.look },                                                          // I2
    ledger: { name: "ledger", desc: T.item.ledger.look },                                                         // I3
    manifest: { name: "shipping manifest", desc: T.item.manifest.look },                                         // I4
    photos: { name: "deal photos", aliases: ["photo"], desc: T.item.photos.look },                              // I5
    // scenery (not GDD items): examine is free and safe
    rifle: { name: "gold rifle", at: "trophy", fixed: true, desc: T.item.rifle },
    piano: { name: "piano", at: "salon", fixed: true, aliases: ["lid"], desc: T.item.piano },
    staircase: { name: "staircase", at: "foyer", fixed: true, aliases: ["stairs", "staircases", "step", "steps", "thirteenth step", "13th step"], desc: T.item.staircase },
    hippo: { name: "hippo", at: "atrium", fixed: true, aliases: ["pepita", "fountain"], desc: T.item.hippo },
    aviary: { name: "aviary", at: "aviary", fixed: true, aliases: ["door", "keypad"], desc: T.item.aviary },
    giraffegate: { name: "giraffe gate", at: "terrace", fixed: true, desc: T.item.giraffegate },
    jaguargate: { name: "jaguar gate", at: "terrace", fixed: true, desc: T.item.jaguargate }
  },

  npcs: {
    don: { name: "Don Chava", at: "foyer", aliases: ["don", "chava", "salvatore"], desc: T.don.look,                // N1
      dialogue: { start: { text: T.don.talk } } },
    nando: { name: "Nando", aliases: ["guard"], desc: T.nando.look, dialogue: { start: { text: T.nando.greet } } }  // N2 (offstage until a checkpoint)
    // N3 Big Tony is heard, never met: he is the clock below.
  },

  on: {   // global replies (verbs add-on), after the room's own
    use: [
      { if: { said: "coin", has: "coin" }, say: T.item.coin.use },
      { if: { said: "card|briefing", has: "card" }, say: T.item.card.use },
      { if: { said: "ledger|manifest|photos|photo" }, say: T.item.evidence } ],
    drop: [{ if: { said: "ledger|manifest|photos|photo" }, say: T.item.evidence }],
    Take: [
      { if: { said: "card|briefing", has: "card" }, say: T.item.card.take },
      { if: { said: "coin", here: "coin" }, move: { coin: "player" }, say: T.item.coin.take } ],
    talk: [{ if: { said: "nando|guard", min: { cleared: 1 }, not: { here: "nando" } }, say: T.nando.after }],
    run: [{ if: { flag: "checkpoint", max: { ran: 0 } }, ...CLEAR, add: { ran: 1, cleared: 1 }, say: T.guard.run }],
    say: [alibi("peacocks"), alibi("giraffe"), alibi("jaguar")],
    open: [{ if: { ...TOUR, said: "gate|giraffe|jaguar" }, say: T.gateTour }],
    hint: [
      { if: { ...ESC, in: "salon", not: { flag: "p1" } }, say: T.p1.hint },
      { if: { ...ESC, in: "atrium", not: { flag: "p2" } }, say: T.p2.hint },
      { if: { ...ESC, in: "foyer", not: { flag: "p3" } }, say: T.p3.hint },
      { if: ESC, say: T.hint.escape },
      { say: T.hint.tour } ],
    status: [
      { if: TOUR, say: T.statusTour },
      { line: ["Bigfoot clock: {clock} turns. Secrets: {secrets}/3. Run: ", [{ if: { min: { ran: 1 } }, text: "used" }, "ready"],
        ". Alibis: ", { list: [unused("peacocks", "PEACOCKS"), unused("giraffe", "GIRAFFE"), unused("jaguar", "JAGUAR")], none: "none" }, "."] } ]
  },

  events: [
    // endings first: once one fires, nothing after it runs
    { if: { min: { strikes: 3 } }, end: T.end.L1 },
    { if: { flag: "won", min: { secrets: 3 } }, end: T.end.W2 },
    { if: { flag: "won" }, end: T.end.W1 },
    // tour: arriving at each stop moves the Don along and plays his line
    ...LEGS.map(([, , to], k) => ({ if: { in: to, min: { leg: k }, max: { leg: k } }, add: { leg: 1 }, move: { don: to },
      ...(T.don.stop[ROOM[to]] && LEGS.findIndex(l => l[2] === to) === k && { say: T.don.stop[ROOM[to]] + (QUIZ[to] ? " " + QUIZ[to][1] : "") }) })),
    // ESCAPE begins on entering R11: the Don flees, the Bigfoot clock starts at 18
    { if: { in: "terrace" }, set: "escape", move: { don: null }, add: { clock: 18 }, mark: "tick" },
    { repeat: true, if: { ...ESC, since: { tick: 1 } }, mark: "tick", add: { clock: -1 } },   // every turn-costing command
    { if: { flag: "checkpoint", since: { stop: 1 } }, end: T.end.L2 },
    { if: { ...ESC, max: { clock: 0 } }, end: T.end.L3 },
    { if: { ...ESC, max: { clock: 6 } }, say: T.clock[6] },
    { if: { ...ESC, max: { clock: 3 } }, say: T.clock[3] },
    { if: { ...ESC, max: { clock: 1 } }, say: T.clock[1] },
    // guard checkpoints: first ESCAPE entry into R7, then into R2
    ...["gallery", "foyer"].map(r => ({ if: { ...ESC, in: r }, set: "checkpoint", mark: "stop", move: { nando: r }, say: T.nando.greet })),
    // REVISIT text after the first look at each room
    ...Object.keys(ROOM).map(r => ({ if: { in: r }, set: `been_${r}` }))
  ]
};
</script>

<script>
/* =====================================================================
   ENGINE — reuse as-is. Conditions, effects and commands live in the COND,
   EFFECT and CMDS tables, which add-ons extend (see ADD-ONS below).
   On load, validate() checks the game data and lists any problems on the
   start menu (and in the browser console) with the exact path.
   ===================================================================== */
const $ = id => document.getElementById(id), out = $("out"), inp = $("in");
const DIRS = { n: "north", s: "south", e: "east", w: "west", u: "up", d: "down" };
const ALIAS = { z: "wait", l: "look", i: "inventory", inv: "inventory", x: "examine", get: "take", grab: "take",
  walk: "go", move: "go", speak: "talk", h: "help", "?": "help" };
const FILLER = ["a", "an", "the", "to", "at", "with", "on"];
const FREE = ["help", "menu"];                    // commands that don't cost a turn
const ADDONS = [], HOOKS = { before: [], afterTurn: [], validate: [] }, CLASH = [];
let S, SAVE = null;   // SAVE = the continue slot: a text snapshot of S (a plug-in can persist it)

function print(t, c) {
  const p = document.createElement("p"); if (c) p.className = c;
  t.split(/\[(\w+)\]/).forEach((s, i) => {          // odd parts are ids from [id]
    const o = i % 2 && (G.npcs[s] || G.items[s]);
    if (!o) return p.append(i % 2 ? `[${s}]` : s);   // unknown id stays visible for the author
    const sp = document.createElement("span");
    sp.className = G.npcs[s] ? "npc" : "item"; sp.textContent = o.name; p.append(sp);
  });
  out.append(p); out.scrollTop = out.scrollHeight;
}
const names = ids => ids.map(i => `[${i}]`).join(", ");
const at = (T, place = S.room) => Object.keys(T).filter(id => S.loc[id] === place);
const inv = () => at(G.items, "player");
const all = (o, f) => Object.entries(o || {}).every(([k, n]) => f(S.count[k] || 0, n, k));
const find = (w, ids, T) => ids.find(id => { const n = T[id].name.toLowerCase();
  return id === w || n === w || n.split(" ").includes(w) || (T[id].aliases || []).includes(w); });
const txt = v => [].concat(v).map(x => typeof x === "string" ? { text: x } : x).find(x => test(x.if))?.text
  .replace(/\{(\w+)\}/g, (_, k) => S.count[k] || 0) || "";   // {counter} shows its value

// ---- conditions: every key in an "if" must pass
const COND = {
  has: v => S.loc[v] === "player",
  here: v => S.loc[v] === S.room,
  in: v => S.room === v,
  flag: v => !!S.flags[v],
  not: v => !test(v),
  min: o => all(o, (v, n) => v >= n),
  max: o => all(o, (v, n) => v <= n),
  since: o => all(o, (v, n, k) => k in S.mark && S.count.turns - S.mark[k] >= n)
};
const test = (c = {}) => Object.keys(c).every(k => !COND[k] || COND[k](c[k]));

// ---- effects: run in table order; say, goto and end always run last
const EFFECT = {
  set: v => S.flags[v] = true,
  unset: v => delete S.flags[v],
  add: o => { for (const k in o) S.count[k] = (S.count[k] || 0) + o[k]; },
  mark: v => S.mark[v] = S.count.turns,
  move: o => { for (const id in o) { const r = o[id];   // a list is a route: step to the next room
    S.loc[id] = Array.isArray(r) ? r[(r.indexOf(S.loc[id]) + 1) % r.length] : r; } },
  take: v => { S.loc[v] = null; print(`(Lost: [${v}])`, "cmd"); },
  give: v => { S.loc[v] = "player"; print(`(Received: [${v}])`, "cmd"); },
  say: v => { const t = txt(v); if (t) print(t); },
  goto: v => enter(v),
  end: v => { print(txt(v), "title"); S.over = true; }
};
const LAST = ["say", "goto", "end"];
function run(e = {}) {
  for (const k of [...Object.keys(EFFECT).filter(k => !LAST.includes(k)), ...LAST]) if (k in e) EFFECT[k](e[k]);
}

function events() {
  (G.events || []).forEach((e, i) => { if (!S.over && (e.repeat || !S.fired[i]) && test(e.if)) { S.fired[i] = true; run(e); } });
}

function look() {
  const r = G.rooms[S.room], d = txt(r.desc), extra = T => at(T).filter(id => !d.includes(`[${id}]`));
  const it = extra(G.items), np = extra(G.npcs), ex = Object.keys(r.exits || {});
  print(r.name, "title"); print(d);
  if (it.length) print("You see: " + names(it));
  if (np.length) print("Here: " + names(np));
  if (ex.length) print("Exits: " + ex.join(", "));
}

function enter(id) { S.room = id; exec("look"); }

function go(d) {
  d = DIRS[d] || d;
  const x = (G.rooms[S.room].exits || {})[d];
  if (!x) return print("You can't go that way.");
  const e = typeof x === "string" ? { to: x } : x;
  test(e.if) ? enter(e.to) : print(txt(e.fail || "Something blocks the way."));
}

function node(npc, id) {
  const n = G.npcs[npc].dialogue[id], opts = (n.options || []).filter(o => test(o.if));
  print(`[${npc}]: "${txt(n.text)}"`);
  S.talk = opts.length ? { npc, opts } : null;
  opts.forEach((o, i) => print(`${i + 1}. ${o.text}`, "cmd"));
}

// ---- commands: each gets the rest of the typed line (filler words removed)
const CMDS = {
  look,
  go,
  take(a) {
    const id = find(a, at(G.items), G.items);
    if (!id) return print("You don't see that here.");
    if (G.items[id].fixed) return print("You can't take that.");
    S.loc[id] = "player"; print(`Taken: [${id}]`);
  },
  drop(a) {
    const id = find(a, inv(), G.items);
    if (!id) return print("You don't have that.");
    S.loc[id] = S.room; print(`Dropped: [${id}]`);
  },
  inventory() { const i = inv(); print(i.length ? "You carry: " + names(i) : "You carry nothing."); },
  examine(a) {
    if (!a) return exec("look");
    const id = find(a, [...inv(), ...at(G.items)], G.items), n = find(a, at(G.npcs), G.npcs);
    print(id ? txt(G.items[id].desc) : n ? txt(G.npcs[n].desc) : "You don't see that.");
  },
  use(a) {
    const id = find(a, inv(), G.items);
    if (!id) return print("You don't have that.");
    const u = (G.items[id].use || []).find(u => test(u.if));
    u ? run(u) : print("Nothing happens.");
  },
  talk(a) {
    const l = at(G.npcs), n = a ? find(a, l, G.npcs) : l[0];
    if (!n) return print("No one by that name is here.");
    G.npcs[n].dialogue ? node(n, "start") : print(`[${n}] doesn't respond.`);
  },
  wait() { print("Time passes."); },
  help() { print("Commands: " + Object.keys(CMDS).join(", ") + ". Directions: n, s, e, w, u, d."); },
  menu
};

// a command runs unless a "before" hook handles it first
const exec = (v, a = "") => HOOKS.before.some(h => h(v, a)) || CMDS[v](a);

function act(w) {
  if (S.talk) {
    if (/^\d+$/.test(w[0])) {
      const o = S.talk.opts[w[0] - 1], npc = S.talk.npc;
      if (!o) return print("Choose a number from the list.");
      S.talk = null; run(o); if (o.next && !S.over) node(npc, o.next); return;
    }
    S.talk = null; // any other command ends the conversation
  }
  let [v, ...r] = w; v = ALIAS[v] || v;
  if (DIRS[v] || Object.values(DIRS).includes(v)) { r = [v]; v = "go"; }
  if (S.over && v !== "menu") return print("The game is over. Type 'menu' to return to the start menu.");
  if (!CMDS[v]) return print("I don't understand that. Type 'help'.");
  if (!FREE.includes(v)) S.count.turns++;   // count before acting so marks stamp this turn
  exec(v, r.join(" "));
}

function parse(raw) {
  const w = raw.toLowerCase().trim().split(/\s+/).filter(x => x && !FILLER.includes(x));
  if (!w.length) return;
  print("> " + raw, "cmd");
  act(w);
  if (!S.talk) { events(); HOOKS.afterTurn.forEach(h => S.over || h()); }
  save();
}

const save = () => SAVE = S.over ? null : JSON.stringify(S);   // finished games can't be continued

function start() {
  S = { room: G.start, loc: {}, flags: {}, count: { turns: 0 }, mark: {}, fired: {}, talk: null, over: false };
  for (const T of [G.items, G.npcs]) for (const id in T) S.loc[id] = T[id].at ?? null;
  for (const a of ADDONS) if (a.state) S[a.name] = JSON.parse(JSON.stringify(a.state));
  print(G.title, "title"); print(txt(G.intro)); enter(G.start); events(); save();
}

function addon(a) {
  ADDONS.push(a);
  for (const [T, R] of [[a.commands, CMDS], [a.conditions, COND], [a.effects, EFFECT]])
    for (const k in T || {}) { if (k in R) CLASH.push(`addon ${a.name}: "${k}" is already defined`); R[k] = T[k]; }
  Object.assign(ALIAS, a.aliases); FREE.push(...(a.free || []));
  for (const h in HOOKS) if (a[h]) HOOKS[h].push(a[h]);
}

function validate() {
  const E = [...CLASH], room = r => r in G.rooms, thing = t => t in G.items || t in G.npcs;
  const need = (ok, path, msg) => ok || E.push(`${path}: ${msg}`);
  const used = { flag: {}, mark: {}, counter: {} }, made = { flag: {}, mark: {}, counter: { turns: 1 } };
  const walk = (v, p) => {
    if (typeof v === "string") return [...v.matchAll(/\[(\w+)\]/g)].forEach(m => need(thing(m[1]), p, `[${m[1]}] is not an item or NPC`));
    if (!v || typeof v !== "object") return;
    for (const k in v) {
      const x = v[k], q = Array.isArray(v) ? `${p}[${k}]` : p ? `${p}.${k}` : k;
      if (k === "if" || k === "not") for (const c in x) need(c in COND, `${q}.${c}`, `unknown condition "${c}"`);
      if (["has", "give", "take"].includes(k)) need(x in G.items, q, `no item "${x}"`);
      if (k === "here") need(thing(x), q, `no item or NPC "${x}"`);
      if (["in", "goto", "to"].includes(k)) need(room(x), q, `no room "${x}"`);
      if (k === "move") for (const id in x) { need(thing(id), q, `no item or NPC "${id}"`);
        [].concat(x[id]).forEach(r => need(r === null || r === "player" || room(r), q, `no room "${r}"`)); }
      if (k === "flag") used.flag[x] = q;
      if (k === "set" || k === "unset") made.flag[x] = 1;
      if (k === "mark") made.mark[x] = 1;
      if (k === "since") for (const m in x) used.mark[m] = q;
      if (k === "add") for (const c in x) made.counter[c] = 1;
      if (k === "min" || k === "max") for (const c in x) used.counter[c] = q;
      walk(x, q);
    }
  };
  need(room(G.start), "start", `no room "${G.start}"`);
  for (const r in G.rooms) for (const d in G.rooms[r].exits || {}) { const x = G.rooms[r].exits[d];
    if (typeof x === "string") need(room(x), `rooms.${r}.exits.${d}`, `no room "${x}"`); }
  for (const T of ["items", "npcs"]) for (const id in G[T]) { const a = G[T][id].at;
    need(a == null || a === "player" || room(a), `${T}.${id}.at`, `no room "${a}"`); }
  for (const id in G.items) need(!(id in G.npcs), `items.${id}`, "same id as an NPC");
  for (const n in G.npcs) { const D = G.npcs[n].dialogue; if (!D) continue;
    need(D.start, `npcs.${n}.dialogue`, `no "start" node`);
    for (const id in D) (D[id].options || []).forEach((o, i) =>
      need(!o.next || o.next in D, `npcs.${n}.dialogue.${id}.options[${i}].next`, `no node "${o.next}"`)); }
  walk(G, "");
  for (const t in used) for (const k in used[t]) need(made[t][k], used[t][k], `${t} "${k}" is checked but never set`);
  HOOKS.validate.forEach(h => h(need));
  return E;
}

function menu() { document.body.classList.remove("playing"); $("bs").hidden = false; $("bc").hidden = !SAVE; $("ask").hidden = true; }

function play(fresh) {
  document.body.classList.add("playing"); out.innerHTML = "";
  if (fresh) start(); else { S = JSON.parse(SAVE); S.talk = null; exec("look"); }
  inp.focus();
}

// boot runs after every script (including add-ons) has loaded
document.addEventListener("DOMContentLoaded", () => {
  $("f").onsubmit = e => { e.preventDefault(); parse(inp.value); inp.value = ""; };
  $("bs").onclick = () => SAVE ? ($("bs").hidden = $("bc").hidden = true, $("ask").hidden = false, $("bn").focus()) : play(true);
  $("by").onclick = () => play(true);
  $("bn").onclick = menu;
  $("bc").onclick = () => play(false);
  $("mt").textContent = document.title = G.title;
  const problems = validate();
  if (problems.length) { $("err").hidden = false; $("err").textContent = `Game data problems (${problems.length}):\n` + problems.join("\n"); console.error(problems); }
  menu();
});
</script>

<script>
/* ---- ADD-ON: verbs (room and global replies for any verb; what was typed as a condition)
   Data:  rooms.X.on / on: { verb: REPLY }   REPLY = a string, or a list of { if:COND, ...EFFECT }
            (a string entry = { say }). The current room's reply is tried first, then the global
            one (G.on); the first entry whose "if" passes runs.
            A verb the engine doesn't know becomes a command; with no passing entry it prints
            G.fallback (default "You can't do that here.") and still costs a turn.
            For a core verb (take, use, go...), a passing entry runs instead of the core command.
            Capitalize a verb that is also an effect key (Take, Say, Give), or the engine's
            validator reads it as that effect; case doesn't matter otherwise.
          aliases: { word: "command" }   more words for a command ("quit": "menu")
          free:    ["verb", ...]         commands that don't cost a turn
   Condition: said:"phrase"   the words typed after the verb contain the phrase, whole words only.
                "a|b" = either one; a list = every one of them. Hyphens count as spaces, and
                for go a direction is spelled out ("d" is "down").
              any:[COND, ...]  at least one of them passes
   Effect: line:[part, ...]   prints the parts joined together. A part is TEXT, or
             { list:[TEXT, ...], none:TEXT }: the non-empty ones joined with ", ", or none.
   ------------------------------------------------------------------------- */
{
  let said = "";
  const norm = s => ` ${s.toLowerCase().replace(/-/g, " ").replace(/\s+/g, " ").trim()} `;
  const reply = r => { const e = [].concat(r || []).map(x => typeof x === "string" ? { say: x } : x).find(x => test(x.if));
    if (e) run(e); return !!e; };
  const on = o => Object.fromEntries(Object.entries(o.on || {}).map(([v, r]) => [v.toLowerCase(), r]));
  const ON = new Map([G, ...Object.values(G.rooms)].map(o => [o, on(o)]));
  const answer = (v, a) => { said = norm(v === "go" ? DIRS[a] || a : a);
    const ok = reply(ON.get(G.rooms[S.room])[v]) || reply(ON.get(G)[v]); said = ""; return ok; };
  const verbs = new Set([...ON.values()].flatMap(Object.keys));
  const commands = {};
  for (const v of verbs) if (!CMDS[v]) commands[v] = a => answer(v, a) || print(txt(G.fallback || "You can't do that here."));
  const part = p => p?.list ? p.list.map(txt).filter(Boolean).join(", ") || txt(p.none || "") : txt(p);
  addon({
    name: "verbs",
    commands, aliases: G.aliases, free: G.free,
    conditions: {
      said: p => [].concat(p).every(q => q.split("|").some(w => said.includes(norm(w)))),
      any: l => l.some(c => test(c))
    },
    effects: { line: v => print(v.map(part).join("")) },
    before(v, a) { if (!commands[v] && verbs.has(v)) return answer(v, a); },
    validate(need) {
      for (const v of verbs) need(!(v in COND), `on.${v}`, "verb name is also a condition key");
      for (const w in G.aliases || {}) need(w !== G.aliases[w], `aliases.${w}`, "alias points at itself");
    }
  });
}
</script>

<script>
/* ---- ADD-ON: restart ("restart" starts a new game, even after an ending) ----
   No data. The engine only accepts "menu" once a game is over, so this wraps
   the engine's act() to catch "restart" first.
   ------------------------------------------------------------------------- */
{
  const act0 = act;
  act = w => w[0] === "restart" ? play(true) : act0(w);
  addon({ name: "restart" });
}
</script>
</body>
